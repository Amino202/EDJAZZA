<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اجازة - وضع عدم الاتصال</title>
  <meta name="theme-color" content="#0284c7">
  
  <link rel="icon" type="image/png" href="icons/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16x16.png">

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      direction: rtl;
      text-align: center;
      padding: 20px;
      margin: 0;
      background: #f9fafb;
      color: #374151;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
    }
    h1 {
      color: #0284c7;
      margin-bottom: 20px;
      margin-top: 0;
    }
    .icon {
      font-size: 4rem;
      color: #9ca3af;
      margin-bottom: 20px;
    }
    .message {
      background: white;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      margin-bottom: 30px;
    }
    p {
      line-height: 1.6;
      margin-bottom: 10px;
    }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0369a1;
    }
    button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="message">
      <div class="icon">📶</div>
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>التطبيق يعمل في وضع عدم الاتصال. بعض الميزات قد لا تكون متاحة.</p>
      <p style="color: #6b7280; font-size: 0.9em;">يرجى الاتصال بالإنترنت للحصول على أحدث البيانات.</p>
      <div style="margin-top: 25px;">
          <button onclick="location.reload()">إعادة المحاولة</button>
      </div>
    </div>
  </div>
</body>
</html>
