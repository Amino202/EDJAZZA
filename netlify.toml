# ملف: netlify.toml
# ضع هذا الملف في جذر مشروعك على Netlify

[build]
  command = "echo 'Building...'"
  publish = "."

# إضافة رؤوس HTTP للملفات
[[headers]]
  for = "/*"
  [headers.values]
    # اسمح بـ Service Worker
    Service-Worker-Allowed = "/"
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

# رؤوس خاصة بـ Service Worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# رؤوس خاصة بـ manifest.json
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# إعادة توجيه لـ SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200